# Builds and publishes a release when you push a version tag.
#
#   1. Bump `version` under [workspace.package] in Cargo.toml (e.g. 0.2.0),
#      add a section for it to CHANGELOG.md, and commit.
#   2. git tag v0.2.0 && git push origin v0.2.0
#
# The workflow tests, builds the installer and attaches it to a GitHub Release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and "v$v" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME doesn't match the Cargo.toml version ($v). Bump the version first."
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install web dependencies
        run: npm ci

      - name: Test
        run: cargo test --workspace --release --locked

      - name: Build the app
        run: npm run tauri -- build --no-bundle

      - name: Build the background service and the AI assistant bridge
        run: cargo build --release --locked -p portlight-collector -p portlight-mcp

      - name: Build the server owner list (iptoasn.com, public domain)
        shell: pwsh
        run: scripts\update-owners.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\portlight.iss'

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success -or -not $m.Groups[1].Value.Trim()) {
            throw "CHANGELOG.md has no section for $v. Add one before releasing."
          }
          $m.Groups[1].Value.Trim() | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/Portlight-Setup-${{ steps.version.outputs.version }}.exe
          body_path: release-notes.md

      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Portlight-Setup-${{ steps.version.outputs.version }}
          path: installer/Output/*.exe
