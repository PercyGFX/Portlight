[package]
name = "portlight-geo"
description = "Who owns an IP address, and where its network is registered: an offline lookup built from the public-domain iptoasn.com data."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
flate2 = "1"
serde = { workspace = true }

# Converts the iptoasn.com download into owners.bin, and looks addresses up in it.
[[bin]]
name = "portlight-owners"
path = "src/bin/portlight-owners.rs"
