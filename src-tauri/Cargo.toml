[package]
name = "portlight"
description = "See which apps on your PC are online, get told when a new one connects, and ask your AI assistant about it."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the library name different from the binary name,
# which Windows needs (https://github.com/rust-lang/cargo/issues/8519).
name = "portlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portlight-core.workspace = true
portlight-platform.workspace = true
portlight-packets.workspace = true
portlight-geo.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
png = "0.18"
base64 = "0.21"
tauri-plugin-single-instance = "2"
dns-lookup = "3"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
