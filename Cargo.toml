[workspace]
resolver = "3"
members = ["crates/core", "crates/platform", "crates/packets", "crates/geo", "crates/collector", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
authors = ["PercyGFX"]
repository = "https://github.com/PercyGFX/Portlight"

[workspace.dependencies]
portlight-core = { path = "crates/core" }
portlight-platform = { path = "crates/platform" }
portlight-packets = { path = "crates/packets" }
portlight-geo = { path = "crates/geo" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small, fast release binary. See https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
